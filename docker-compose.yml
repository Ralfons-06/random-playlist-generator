version: '3.8'

services:
  generator:
    build: .
    container_name: playlist-generator
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "cron && tail -f /var/log/cron.log"]
    restart: unless-stopped

  dashboard:
    build: .
    container_name: playlist-dashboard
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    command: ["python", "src/dashboard.py"]
    restart: unless-stopped